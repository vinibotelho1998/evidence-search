<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">Evidence Search — arquitetura implementada</title>
<desc id="description">Isolamento aplicado antes do ranking, com modos lexical e semântico explícitos.</desc>
